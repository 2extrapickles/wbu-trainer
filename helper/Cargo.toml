[package]
name = "wbu-trainer-helper"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "In-game helper for the WBU trainer (dinput8.dll proxy)"

# Builds dinput8.dll for the 32-bit game; target set in .cargo/config.toml.
[lib]
name = "dinput8"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
